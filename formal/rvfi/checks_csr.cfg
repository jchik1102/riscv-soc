# riscv-formal CSR checks for core_pipeline (scripts/run_riscv_formal.sh
# CFG=checks_csr). CSR instructions are allowed in the instruction stream here
# (RVFI_CSR in env.sv); ECALL, EBREAK, MRET, WFI, FENCE and M encodings stay
# excluded. Bounded model checks, depth in cycles from reset.
#
#   csrw_<csr>       a CSR instruction on that CSR: rd gets the value read, the
#                    value written is the set/clear/swap of rs1 or the immediate,
#                    the next PC is PC+4, and a write to a read-only CSR traps
#   csrc_any_<csr>   a later read returns what the last write stored, on the
#                    masked bits. riscv-formal's check keeps a 32-bit copy of
#                    the written rs1 value, so on RV64 it can only compare the
#                    low 32 bits; the masks below also leave out the bits a
#                    register does not implement (mtvec[1:0], all of mie but
#                    bits 3, 7 and 11). csrw covers all 64 bits of each write.
#   csrc_zero_<csr>  the CSR always reads zero
#   csr_ill_<addr>   an access to that address traps as an illegal instruction
#
# reg, pc_fwd, pc_bwd, unique and causal are the same checks as in checks.cfg,
# rerun here with CSR instructions in the stream (so a CSR result is forwarded
# like any other, and traps go to whatever mtvec the program wrote).
#
# mepc, mcause, mtval and mstatus are also changed by traps, so only their
# csrw checks are run, not csrc_any. mcycle and minstret are not checked.

[options]
isa rv64i
nret 1
solver bitwuzla

[depth]
csrw            20
csr_ill         20
csrc_any   1    20
csrc_zero  1    20
reg        10   20
pc_fwd     10   20
pc_bwd     10   20
unique      1   10   20
causal     10   20

[csrs]
mscratch        any_mask="64'h00000000ffffffff"
mtvec           any_mask="64'h00000000fffffffc"
mie             any_mask="64'h0000000000000888"
mepc
mcause
mtval
mstatus
misa
mip
mvendorid       zero
marchid         zero
mimpid          zero
mhartid         zero

[illegal_csrs]
fff     m       rw
7c0     m       rw
f11     m       w
c00     m       rw

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

[verilog-files]
@ROOT@/formal/rvfi/wrapper.v

[script-sources]
plugin -i slang
read_slang -D RISCV_FORMAL -D RVFI_EXCLUDE_M -D RVFI_CSR @ROOT@/rtl/soc/platform_pkg.sv @ROOT@/rtl/soc/soc_pkg.sv @ROOT@/rtl/core/core_pkg.sv @ROOT@/rtl/core/decoder.sv @ROOT@/rtl/core/alu.sv @ROOT@/rtl/core/load_store.sv @ROOT@/rtl/core/regfile.sv @ROOT@/rtl/core/mul_iter.sv @ROOT@/rtl/core/div_iter.sv @ROOT@/rtl/core/muldiv_unit.sv @ROOT@/rtl/core/csr_file.sv @ROOT@/rtl/core/core_pipeline.sv @ROOT@/formal/rvfi/env.sv --top rvfi_core_env
