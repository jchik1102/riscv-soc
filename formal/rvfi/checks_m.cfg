# riscv-formal configuration for core_pipeline (scripts/run_riscv_formal.sh
# copies this to build/rvfi/cores/riscv_soc/ and replaces @ROOT@ with the
# repository path). Bounded model checks: each check holds for every
# instruction sequence and bus timing up to its depth (in cycles from reset).
# M instructions: RV64IM with M encodings allowed in the instruction stream,
# checked against riscv-formal's alternative operations (RISCV_FORMAL_ALTOPS,
# implemented by rtl/core/muldiv_unit.sv when it is defined). Only the
# insn_<m-op> checks are run (scripts/run_riscv_formal.sh CFG=checks_m), at a
# smaller depth than checks.cfg: with M in the stream, depth 20 took more than
# 30 minutes for a single check.

[options]
isa rv64im
nret 1
solver bitwuzla

[depth]
insn            @MDEPTH@

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS

[verilog-files]
@ROOT@/formal/rvfi/wrapper.v

[script-sources]
plugin -i slang
read_slang -D RISCV_FORMAL -D RISCV_FORMAL_ALTOPS @ROOT@/rtl/soc/platform_pkg.sv @ROOT@/rtl/soc/soc_pkg.sv @ROOT@/rtl/core/core_pkg.sv @ROOT@/rtl/core/decoder.sv @ROOT@/rtl/core/alu.sv @ROOT@/rtl/core/load_store.sv @ROOT@/rtl/core/regfile.sv @ROOT@/rtl/core/mul_iter.sv @ROOT@/rtl/core/div_iter.sv @ROOT@/rtl/core/muldiv_unit.sv @ROOT@/rtl/core/csr_file.sv @ROOT@/rtl/core/core_pipeline.sv @ROOT@/formal/rvfi/env.sv --top rvfi_core_env
