# riscv-formal configuration for core_pipeline (scripts/run_riscv_formal.sh
# copies this to build/rvfi/cores/riscv_soc/ and replaces @ROOT@ with the
# repository path). Bounded model checks: each check holds for every
# instruction sequence and bus timing up to its depth (in cycles from reset).
# M-extension encodings are excluded from the instruction stream here
# (RVFI_EXCLUDE_M in env.sv); checks_m.cfg checks the M instructions.

[options]
isa rv64i
nret 1
solver bitwuzla

[depth]
insn            20
reg        10   20
pc_fwd     10   20
pc_bwd     10   20
unique      1   10   20
causal     10   20
ill             20

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

[verilog-files]
@ROOT@/formal/rvfi/wrapper.v

[script-sources]
plugin -i slang
read_slang -D RISCV_FORMAL -D RVFI_EXCLUDE_M @ROOT@/rtl/soc/platform_pkg.sv @ROOT@/rtl/soc/soc_pkg.sv @ROOT@/rtl/core/core_pkg.sv @ROOT@/rtl/core/decoder.sv @ROOT@/rtl/core/alu.sv @ROOT@/rtl/core/load_store.sv @ROOT@/rtl/core/regfile.sv @ROOT@/rtl/core/mul_iter.sv @ROOT@/rtl/core/div_iter.sv @ROOT@/rtl/core/muldiv_unit.sv @ROOT@/rtl/core/csr_file.sv @ROOT@/rtl/core/core_pipeline.sv @ROOT@/formal/rvfi/env.sv --top rvfi_core_env
