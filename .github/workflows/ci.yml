# What runs on GitHub-hosted runners: the Python model and checker tests, a
# Verilator lint of the RTL, the README number check, and the SymbiYosys checks
# of the M unit and the async FIFO.
# The XSim/UVM regression, ACT4, riscv-dv, CoreMark and the Quartus build need
# the Windows vendor tools and run locally (make test, act, riscvdv, coremark,
# fpga).
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  models:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest tests -q

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          version: '2026-10-14'
      # Verilator -Wall over the whole SoC (both cores), the SDRAM controller and
      # tester and the DDR3 bridge; fails on any warning without a waiver and reason.
      - run: bash scripts/lint.sh
      # Every number in a README table must be in the log the row links.
      - run: python3 scripts/check_readme_numbers.py

  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          version: '2026-10-14'
      - run: FORMAL_JOBS=4 bash scripts/run-formal.sh
      # The async FIFO proof must fail on each of its 4 mutants.
      - run: bash scripts/formal-cdc-mutants.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-results
          path: results/formal
